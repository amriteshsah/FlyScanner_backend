server:
  port: \${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: flyscanner-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: \${DB_URL:jdbc:postgresql://localhost:5432/flyscanner}
    username: \${DB_USERNAME:flyscanner}
    password: \${DB_PASSWORD:flyscanner_local_only}
    hikari:
      maximum-pool-size: \${DB_POOL_MAX_SIZE:5}
      minimum-idle: \${DB_POOL_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-none}]"
